version: 2

models:
  - name: stg_transactions
    description: Cleaned and typed raw transactions (pass-through, includes corrupt records)
    columns:
      - name: _record_status
        tests:
          - not_null
          - accepted_values:
              values: ["CLEAN", "CORRUPT"]

  - name: stg_accounts
    description: Cleaned and typed raw accounts (pass-through, includes corrupt records)
    columns:
      - name: _record_status
        tests:
          - not_null
          - accepted_values:
              values: ["CLEAN", "CORRUPT"]

  - name: stg_forex
    description: Parsed forex rates from raw JSON (pass-through, includes corrupt records)
    columns:
      - name: _record_status
        tests:
          - not_null
          - accepted_values:
              values: ["CLEAN", "CORRUPT"]
