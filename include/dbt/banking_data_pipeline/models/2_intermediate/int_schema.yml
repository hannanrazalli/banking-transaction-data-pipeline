version: 2

models:
  - name: int_transactions_refined
    description: Clean, deduplicated transactions with forex conversion
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: account_id
        tests:
          - not_null
      - name: transaction_type
        tests:
          - not_null

  - name: int_accounts_refined
    description: Clean, deduplicated account records
    columns:
      - name: account_id
        tests:
          - not_null
          - unique

  - name: int_forex_refined
    description: Clean, deduplicated forex rates
    columns:
      - name: forex_date
        tests:
          - not_null
      - name: base_currency
        tests:
          - not_null
      - name: exchange_rate_myr
        tests:
          - not_null

  - name: int_transactions_qrt
    description: Quarantined records from stg_transactions
    columns:
      - name: _record_status
        tests:
          - not_null

  - name: int_forex_qrt
    description: Quarantined records from stg_forex
    columns:
      - name: _record_status
        tests:
          - not_null
